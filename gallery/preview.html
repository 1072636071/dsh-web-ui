<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 皮肤试穿</title>
<!-- Generated by scripts/gallery-build: 皮肤元数据 + bundle 文本 -->
<script src="manifest.js"></script>
<script src="bundles.js"></script>
<!-- Generated by scripts/export-official-facade: 官方 GUI 的样式 + 脱敏 DOM 快照 -->
<script src="official-facade.js"></script>
<style>
  /* ==========================================================================
     DSH 皮肤试穿模拟器 · gallery/preview.html
     --------------------------------------------------------------------------
     默认外观 = 官方 dsh web GUI 的真实快照（scripts/export-official-facade
     从运行中的 GUI 导出：官方样式表 + 脱敏 #root DOM）。皮肤 = 真实执行
     所选皮肤的 client bundle（shim __ModuleLoader__ 捕获 exports.apply，最小
     ctx 调用），皮肤注入的标题栏、状态栏、背景与样式全部真实渲染。
     ?skin=<id>&theme=light|dark 控制选择；?chrome=0 隐藏右上工具栏（截图用）。
     skin=stock 显示官方默认外观。
     ========================================================================== */

  html, body { height: 100%; margin: 0; }
  body { min-height: 100vh; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }

  /* --- 错误横幅 / 工具栏：模拟器自己的 chrome，独立于官方界面 ---------------- */
  .skinErr {
    display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    max-width: 80%; padding: 8px 14px; border-radius: 8px; z-index: 999999;
    background: #a00; color: #fff; font: 12px/1.5 ui-monospace, Menlo, monospace;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
  }
  .skinChrome {
    position: fixed; right: 10px; bottom: 10px; z-index: 999998;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 10px;
    background: rgba(20, 28, 40, .82); color: #e6ecf4;
    font-size: 12px; backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  }
  .skinChrome select, .skinChrome a {
    border: 0; border-radius: 6px; padding: 4px 8px;
    background: rgba(255, 255, 255, .14); color: #e6ecf4;
    font: 12px inherit; text-decoration: none;
  }
  .skinChrome button {
    border: 1px solid rgba(255, 255, 255, .22); border-radius: 6px; padding: 3px 10px;
    background: transparent; color: #e6ecf4; font-size: 12px;
  }
  .skinChrome button:hover { background: rgba(255, 255, 255, .14); }
</style>
</head>
<body>
  <div id="root"></div>

  <div class="skinErr" id="skinErr"></div>

  <div class="skinChrome" id="skinChrome">
    <select id="skinSel" aria-label="皮肤"></select>
    <button type="button" id="themeBtn" aria-label="切换明暗">🌙 暗色</button>
    <a href="index.html" target="_blank" rel="noopener">主题库</a>
  </div>

<script>
(function () {
  'use strict'

  var qs = new URLSearchParams(location.search)
  var manifest = window.SKIN_MANIFEST && window.SKIN_MANIFEST.skins
  var ids = manifest ? manifest.map(function (s) { return s.id }) : []

  var params = {
    skin: qs.get('skin') || 'stock',
    theme: qs.get('theme') === 'dark' ? 'dark' : 'light',
    chrome: qs.get('chrome') !== '0',
  }
  if (params.skin !== 'stock' && ids.indexOf(params.skin) === -1) params.skin = ids[0] || 'stock'

  /** 官方 facade：样式注入 + 骨架挂载（只做一次）。 */
  function mountOfficialFacade() {
    if (document.getElementById('official-facade-css')) return
    if (!window.OFFICIAL_FACADE) {
      fail('official-facade.js 缺失（先运行 scripts/export-official-facade）')
      return
    }
    var style = document.createElement('style')
    style.id = 'official-facade-css'
    style.textContent = window.OFFICIAL_FACADE.css
    document.head.appendChild(style)
    document.getElementById('root').innerHTML = window.OFFICIAL_FACADE.skeleton
  }

  function setTheme(dark) {
    if (dark) document.body.dataset.dsDarkTheme = ''
    else delete document.body.dataset.dsDarkTheme
    try {
      var u = new URL(location.href)
      u.searchParams.set('theme', dark ? 'dark' : 'light')
      history.replaceState(null, '', u)
    } catch (e) { /* file:// 下可能受限，忽略 */ }
  }

  function fail(msg) {
    var el = document.getElementById('skinErr')
    el.textContent = '皮肤加载失败: ' + msg
    el.style.display = 'block'
  }

  /** 真实执行皮肤 bundle：shim __ModuleLoader__ 捕获 exports.apply，用最小
      ctx（effect 收集 disposer）调用。 */
  function loadSkin(id) {
    var text = window.SKIN_BUNDLES && window.SKIN_BUNDLES[id]
    if (!text) throw new Error('bundle 缺失（先运行 scripts/gallery-build）: ' + id)
    var skinApply = null
    var disposers = []
    window.__ModuleLoader__ = {
      load: function (entry) {
        var result = entry.factory(function require(spec) {
          throw new Error('模拟器不支持 require(' + JSON.stringify(spec) + ')')
        })
        skinApply = result && result.apply
      },
    }
    // 在 iframe 全局作用域执行 bundle（引用 window/document 即本页）
    ;(0, eval)(text)
    if (typeof skinApply !== 'function') throw new Error(id + ' bundle 未导出 apply()')
    skinApply({
      effect: function (cb) { disposers.push(cb()) },
    })
  }

  function boot() {
    mountOfficialFacade()
    setTheme(params.theme === 'dark')   // 先于 apply：blue-fantasy 在 apply 里读主题
    if (params.skin !== 'stock') {
      try { loadSkin(params.skin) } catch (err) { fail(err && err.message || String(err)) }
    }
  }

  // --- 工具栏 ----------------------------------------------------------------
  var chrome = document.getElementById('skinChrome')
  var sel = document.getElementById('skinSel')
  var themeBtn = document.getElementById('themeBtn')
  if (params.chrome) {
    var opt = document.createElement('option')
    opt.value = 'stock'; opt.textContent = '默认外观'
    sel.appendChild(opt)
    ids.forEach(function (id) {
      var meta = manifest.filter(function (s) { return s.id === id })[0]
      var o = document.createElement('option')
      o.value = id
      o.textContent = (meta ? meta.name : id) + (id === params.skin ? ' · 当前' : '')
      if (id === params.skin) o.selected = true
      sel.appendChild(o)
    })
    sel.addEventListener('change', function () {
      var u = new URL(location.href)
      u.searchParams.set('skin', sel.value)
      location.href = u
    })
    themeBtn.textContent = params.theme === 'dark' ? '☀ 亮色' : '🌙 暗色'
    themeBtn.addEventListener('click', function () {
      setTheme(params.theme !== 'dark')
      params.theme = params.theme === 'dark' ? 'light' : 'dark'
      themeBtn.textContent = params.theme === 'dark' ? '☀ 亮色' : '🌙 暗色'
    })
  } else {
    chrome.remove()
  }

  boot()
})();
</script>
</body>
</html>
